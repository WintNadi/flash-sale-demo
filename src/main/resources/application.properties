# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/flashsale
spring.datasource.username=postgres
spring.datasource.password=postgreswint
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=flash-sale-pool
spring.datasource.hikari.connection-timeout=30000

# Logging — SQL statements (useful for debugging; turn off later)
logging.level.org.springframework.jdbc.core=DEBUG