# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/flashsale
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=flash-sale-pool
spring.datasource.hikari.connection-timeout=30000

# JWT — secret comes from environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Logging — SQL statements (useful for debugging; turn off later)
logging.level.org.springframework.jdbc.core=DEBUG

logging.level.org.example.flashsale.service.ReservationSweeper=DEBUG